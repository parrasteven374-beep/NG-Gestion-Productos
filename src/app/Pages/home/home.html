<div class="container mx-auto m-5 p-5">
  
    



    <div class="hola">
      <h3>Administración de Productos</h3> 
      <button type="button" class="btn btn-primary" (click)="GoToCreateProduct()">Crear Producto</button>
    </div>

    


    <div class="card-body p-">
      <div class="table-responsive">
        <table class="table table-hover table-striped align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th scope="col">Nombre</th>
              <th scope="col">Descripción</th>
              <th scope="col">Precio</th>
              <th scope="col">Stock</th>
              <th scope="col">Eliminar</th>
        
            </tr>
          </thead>
          <tbody>
            @for (item of productos; track item.id) {
              <tr>
                <td class="fw-semibold">{{ item.nombre }}</td>
                <td class="text-muted">{{ item.descripcion }}</td>
                <td class="fw-bold text-success">${{ item.precio }}</td>
                <td>
                  <span class="badge bg-info text-dark">{{ item.stock }} unidades</span>
                  <td><button type="button" class="btn btn-danger" (click)="DeleteProduct(item.id)">Eliminar producto</button></td>
            }
          </tbody>
        </table>
      </div>
    </div>
</div>
