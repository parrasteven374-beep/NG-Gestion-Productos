<div class="container mx-auto m-5 p-5">

  <h2>Formulario para crear un producto</h2>

  <form (ngSubmit)="RegisterProduct()">

    <div class="form-group mb-3">
      <label for="nombre">Nombre</label>
      <input type="text" class="form-control" id="nombre" placeholder="TV LG" name="nombre" [(ngModel)]="newproduct.nombre">
    </div>

    <div class="form-group mb-3">
      <label for="descripcion">Descripción</label>
      <textarea class="form-control" id="descripcion" rows="3" placeholder="TV DE 40 PULGADAS" name="descripcion" [(ngModel)]="newproduct.descripcion"></textarea>
    </div>

    <div class="form-group mb-3">
      <label for="precio">Precio</label>
      <input type="number" class="form-control" id="precio" placeholder="120000" name="precio" [(ngModel)]="newproduct.precio">
    </div>

    <div class="form-group mb-3">
      <label for="stock">Stock</label>
      <input type="number" class="form-control" id="stock" placeholder="240" name="stock" [(ngModel)]="newproduct.stock">
    </div>

    <div class="mb-3">
      <button type="submit" class="btn btn-primary">Crear Producto</button>
    </div>

  </form>

</div>
